name: Build APK

# Builds CatsGame for Android in the cloud and attaches CatsMoonStreet.apk to the run (Artifacts section).
# Needs repository secrets UNITY_EMAIL and UNITY_PASSWORD (a free Unity account).

on:
  push:
    branches: [ccr-cf051de6-y08ep0, main]
    paths: ['CatsGame/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
    inputs:
      bake:
        description: Bake lighting (slower, but the level looks like the reference)
        type: boolean
        default: true

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.31f1
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check Unity secrets
        if: env.UNITY_EMAIL == '' || env.UNITY_PASSWORD == ''
        run: |
          echo "::error::Add repository secrets UNITY_EMAIL and UNITY_PASSWORD (Settings → Secrets and variables → Actions), then re-run this job."
          exit 1

      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false

      - uses: actions/checkout@v4

      # the CI editor can be older than the one the project was last opened in locally
      - run: |
          echo "m_EditorVersion: $UNITY_VERSION" > CatsGame/ProjectSettings/ProjectVersion.txt

      - uses: actions/cache@v4
        with:
          path: CatsGame/Library
          key: Library-Android-${{ hashFiles('CatsGame/Assets/**', 'CatsGame/Packages/**', 'CatsGame/ProjectSettings/**') }}
          restore-keys: Library-Android-

      # Unity 6 activates the free Personal entitlement from the account login alone, so the editor is run
      # directly (unity-builder would also try a serial taken from the license file).
      - name: Build APK in Unity
        env:
          SKIP_BAKE: ${{ (github.event_name == 'workflow_dispatch' && !inputs.bake) && '-catsSkipBake' || '' }}
        run: |
          docker run --rm -e UNITY_EMAIL -e UNITY_PASSWORD -e SKIP_BAKE \
            -v "$GITHUB_WORKSPACE":/w -w /w \
            unityci/editor:ubuntu-${UNITY_VERSION}-android-3 \
            bash -c 'unity-editor -batchmode -nographics -logFile - \
              -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
              -projectPath /w/CatsGame -buildTarget Android \
              -executeMethod Cats.EditorTools.AndroidBuilder.BuildBatch $SKIP_BAKE'

      - uses: actions/upload-artifact@v4
        with:
          name: CatsMoonStreet-apk
          path: CatsGame/Builds/*.apk
          if-no-files-found: error
          retention-days: 30
